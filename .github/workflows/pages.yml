name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test AI decisions
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Kiểm tra: $PAGE_URL"
          HTML="$(curl --retry 12 --retry-delay 2 --retry-all-errors -fsSL "$PAGE_URL")"
          printf '%s' "$HTML" | grep -q 'Điều Binh Khiển Tướng'

          JS_PATH="$(printf '%s' "$HTML" | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2)"
          CSS_PATH="$(printf '%s' "$HTML" | grep -oE 'href="[^"]+\.css"' | head -1 | cut -d'"' -f2)"

          test -n "$JS_PATH"
          test -n "$CSS_PATH"

          JS_URL="$(node -e 'console.log(new URL(process.argv[1], process.argv[2]).href)' "$JS_PATH" "$PAGE_URL")"
          CSS_URL="$(node -e 'console.log(new URL(process.argv[1], process.argv[2]).href)' "$CSS_PATH" "$PAGE_URL")"

          curl --retry 12 --retry-delay 2 --retry-all-errors -fsSL -o /dev/null "$JS_URL"
          curl --retry 12 --retry-delay 2 --retry-all-errors -fsSL -o /dev/null "$CSS_URL"
          echo "Smoke test OK: HTML, JS và CSS đều truy cập được."
