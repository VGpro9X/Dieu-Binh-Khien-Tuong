<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Điều Binh Khiển Tướng</title>
    <style>
      html, body, #app, #game-container {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #0b1220;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #boot-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;
        background: #0b1220;
        color: #cbd5e1;
        font-size: 18px;
        text-align: center;
        padding: 24px;
      }

      #boot-status[data-error="true"] {
        color: #fecaca;
      }
    </style>
    <script>
      window.addEventListener('error', function (event) {
        var status = document.getElementById('boot-status');
        if (!status) return;
        status.dataset.error = 'true';
        status.textContent = 'Không thể khởi tạo game. Lỗi: ' + (event.message || 'không xác định');
      });

      window.addEventListener('unhandledrejection', function (event) {
        var status = document.getElementById('boot-status');
        if (!status) return;
        status.dataset.error = 'true';
        status.textContent = 'Không thể khởi tạo game. Lỗi tải module hoặc tài nguyên.';
      });
    </script>
  </head>
  <body>
    <div id="boot-status">Đang khởi tạo Điều Binh Khiển Tướng V0.6…</div>
    <main id="app">
      <div id="game-container" aria-label="Điều Binh Khiển Tướng"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
